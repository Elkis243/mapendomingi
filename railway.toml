[build]
builder = "NIXPACKS"

[deploy]
# collectstatic + migrate au runtime uniquement (pas au build Docker)
startCommand = "python manage.py collectstatic --noinput && python manage.py migrate --noinput && gunicorn congif.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --log-file -"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
